<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Change Password</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
    <nav th:replace="~{fragments/navbar :: navbar}"></nav>
    <main class="container py-5">
        <h1>Change Password</h1>

        <form th:action="@{/change-password}" th:object="${passwordChange}" method="post">
            <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}" th:errors="*{global}"></div>

            <div class="mb-3">
                <label class="form-label" th:for="currentPassword">Current Password</label>
                <input class="form-control" type="password" th:field="*{currentPassword}">
                <div class="text-danger" th:if="${#fields.hasErrors('currentPassword')}" th:errors="*{currentPassword}"></div>
            </div>

            <div class="mb-3">
                <label class="form-label" th:for="newPassword">New Password</label>
                <input class="form-control" type="password" th:field="*{newPassword}">
                <div class="text-danger" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></div>
            </div>

            <div class="mb-3">
                <label class="form-label" th:for="confirmPassword">Confirm New Password</label>
                <input class="form-control" type="password" th:field="*{confirmPassword}">
                <div class="text-danger" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
            </div>

            <button class="btn btn-primary" type="submit">Change Password</button>
        </form>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
